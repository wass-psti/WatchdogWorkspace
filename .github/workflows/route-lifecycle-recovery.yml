name: Stage G M40 Route Lifecycle Recovery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dependencies:ensure
      - run: npm run route-lifecycle:check
      - run: npm run route-lifecycle:test
      # Preserve frozen M40 browser scenarios on original predecessor; M145
      # verifies ownership of remaining core routes and forbidden retired routes.
      - run: node scripts/run-m145-current-core-browser.mjs route
      - run: npm run typecheck
      - run: npm run lint:eslint
