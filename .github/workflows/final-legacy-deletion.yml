name: Final Legacy Deletion
on:
  workflow_dispatch:
    inputs:
      historical_sha:
        description: 'Must equal exact pre-removal production Git SHA; run on the archived predecessor ref'
        required: true
        type: string
jobs:
  legacy-deletion:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless executing the exact original milestone commit
        shell: bash
        env:
          EXPECTED_HISTORICAL_SHA: ${{ inputs.historical_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SHA" = '994e925898fa7de596050cd06ec68a5a94a7c92b' || { echo 'Historical-only workflow must run on the original archived commit' >&2; exit 1; }
          test "$EXPECTED_HISTORICAL_SHA" = '994e925898fa7de596050cd06ec68a5a94a7c92b' || { echo 'Expected SHA not authorized' >&2; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Supply the SHA-256-verified historical M108 archive to the successor
      # source guard; never bypass or alter historical certification guards.
      - name: Restore pinned M108 predecessor provenance
        uses: ./.github/actions/prepare-m108-baseline
      - run: npm ci
      - run: npm run verify:historical-all
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning verify-settings.mjs
      - run: npm run fueltrack-stabilization:check
      - run: npm run verify:ui
      - run: npm run legacy-deletion:check
      - run: npm run legacy-deletion:test
      - run: npm run backup-dr:check
      - run: npm run service-worker-update:check
      - run: npm run observability:check
      - run: npm run performance:check
      - run: npm run lint:eslint
      - run: npm run typecheck
