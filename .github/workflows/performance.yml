name: Performance
on:
  push:
    branches: [main]
  pull_request:
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/verify-m145-pr-regression.mjs && node scripts/verify-performance-budget-analysis.mjs
      - run: npm run performance:bench
      - run: npm run build
      - run: node scripts/verify-m145-performance-dist.mjs
