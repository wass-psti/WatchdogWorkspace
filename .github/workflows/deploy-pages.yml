name: Deploy WatchdogWorkspace M145 Clean Platform

# Production deployment is possible only from main, after the authenticated
# M108 predecessor and M145 current-core successor gate succeeds. Never deploy
# directly from the QA staging branch or accept the historical M36 artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  authorize-main:
    name: Reject any non-production deployment ref
    runs-on: ubuntu-latest
    steps:
      - name: Require production main ref before invoking release certifier
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'M145 Pages deployment refused: only main is authorized' >&2; exit 1; }
          echo 'Production main-only deployment precondition: PASS'

  certify-current-core:
    name: Verify M145 exact predecessor and current core
    needs: [authorize-main]
    uses: ./.github/workflows/m145-clean-platform-successor.yml
    with:
      runtime_environment: production
    permissions:
      contents: read

  prepare-pages:
    name: Authenticate M145 artifact and backend before Pages upload
    needs: [certify-current-core]
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout reviewed production code
        uses: actions/checkout@v6
      - name: Download artifact produced by successful M145 successor
        uses: actions/download-artifact@v4
        with:
          name: watchdog-m145-core-dist-${{ github.sha }}
          path: dist
      - name: Validate deployment workflow contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/verify-m145-deployment-routing.mjs
      - name: Authenticate downloaded artifact and reject retired runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          test -s dist/service-worker.js
          test -s dist/manifest.webmanifest
          test -s dist/config/runtime-assets.js
          test -s dist/.vite/manifest.json
          test -s dist/.vite/licenses.md
          test -s dist/SHA256SUMS.txt
          ( cd dist && sha256sum -c SHA256SUMS.txt )
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Unapproved source maps in M145 Pages artifact' >&2
            exit 1
          fi
          if grep -qE 'src/main\.tsx?|%BASE_URL%|127\.0\.0\.1|localhost' dist/index.html; then
            echo 'Source-only or local URL reference in M145 production HTML' >&2
            exit 1
          fi
          for retired in time-tracker fueltrack-plus tradelink material-tracker; do
            test ! -d "dist/apps/$retired" || { echo "Retired app in artifact: $retired" >&2; exit 1; }
          done
          test ! -d dist/integrations/material-tracker || { echo 'Material Tracker integration in artifact' >&2; exit 1; }
          echo 'M145 Pages artifact integrity and old-app exclusion: PASS'
      - name: Require production public backend configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo 'Production Supabase URL missing' >&2; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Public Supabase key missing' >&2; exit 1; }
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo 'Unexpected Supabase URL' >&2; exit 1;; esac
      - name: Assert production board-import backend contract
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="${VITE_SUPABASE_URL%/}/rest/v1/rpc/wm_deployment_contract_attestation"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' \
            --data '{}' "$endpoint" -o "$RUNNER_TEMP/wm-backend-attestation.json"
          node -e '
            const fs=require("fs");
            const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/wm-backend-attestation.json","utf8"));
            const a=Array.isArray(raw)?raw[0]:raw;
            if(a?.schema_version!=="1.43.2-m105-v1" ||
               a?.required_rpc!=="wm_import_board_items_atomic" ||
               a?.wm_import_board_items_atomic!==true || a?.compatible!==true)
              throw Error("Required production Board Import backend contract not verified");
            console.log("Production backend attestation: PASS");
          '
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only authenticated M145 distribution to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy M145 clean-platform release to GitHub Pages
    needs: [prepare-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Deploy reviewed and authenticated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Require production public backend configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo 'Production Supabase URL missing' >&2; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Public Supabase key missing' >&2; exit 1; }
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo 'Unexpected Supabase URL' >&2; exit 1;; esac
      - name: Assert production board-import backend contract
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="${VITE_SUPABASE_URL%/}/rest/v1/rpc/wm_deployment_contract_attestation"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' \
            --data '{}' "$endpoint" -o "$RUNNER_TEMP/wm-backend-attestation.json"
          node -e '
            const fs=require("fs");
            const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/wm-backend-attestation.json","utf8"));
            const a=Array.isArray(raw)?raw[0]:raw;
            if(a?.schema_version!=="1.43.2-m105-v1" ||
               a?.required_rpc!=="wm_import_board_items_atomic" ||
               a?.wm_import_board_items_atomic!==true || a?.compatible!==true)
              throw Error("Required production Board Import backend contract not verified");
            console.log("Production backend attestation: PASS");
          '
      - name: Verify live host and retired-app HTTP paths
        shell: bash
        env:
          WM_PRODUCTION_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -Eeuo pipefail
          base="${WM_PRODUCTION_URL%/}/"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${base}" -o "$RUNNER_TEMP/m145-production-index.html"
          test -s "$RUNNER_TEMP/m145-production-index.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${base}service-worker.js" -o "$RUNNER_TEMP/m145-production-service-worker.js"
          grep -q 'work-management-v1.43.2' "$RUNNER_TEMP/m145-production-service-worker.js"
          # Pages may serve a 404 HTML fallback; only the HTTP status matters.
          for old in \
            apps/time-tracker/index.html \
            apps/fueltrack-plus/runtime.html \
            apps/tradelink/runtime.html \
            apps/material-tracker/index.html; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${base}${old}?m145-retired=1")"
            case "$code" in 404|410) ;; *) echo "Retired URL unexpectedly served: $old ($code)" >&2; exit 1;; esac
          done
          echo "M145 live host health and retired module denial: PASS ($base)"
