name: Work Management CI

# M145 is the first current-core successor following decommissioning of
# TimeTracker, FuelTrack+, TradeLink, and Material Tracker. Its historical
# certification executes on the authenticated pre-removal commit, never on
# the now-empty app registry. This workflow delegates the exact M145 gate;
# it is NOT a blanket pass for legacy tests on another source generation.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certified-clean-platform-successor:
    name: M145 historical predecessor and current core
    uses: ./.github/workflows/m145-clean-platform-successor.yml
    permissions:
      contents: read
