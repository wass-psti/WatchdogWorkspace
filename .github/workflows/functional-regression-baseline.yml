name: Stage G M37 Functional Regression Baseline

on:
  workflow_dispatch:
    inputs:
      historical_sha:
        description: 'Must equal exact pre-removal production Git SHA; run on the archived predecessor ref'
        required: true
        type: string
permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless executing the exact original milestone commit
        shell: bash
        env:
          EXPECTED_HISTORICAL_SHA: ${{ inputs.historical_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SHA" = '994e925898fa7de596050cd06ec68a5a94a7c92b' || { echo 'Historical-only workflow must run on the original archived commit' >&2; exit 1; }
          test "$EXPECTED_HISTORICAL_SHA" = '994e925898fa7de596050cd06ec68a5a94a7c92b' || { echo 'Expected SHA not authorized' >&2; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Stage G M37 static baseline
        run: npm run functional-regression:check
      - name: Stage G M37 execution characterization
        run: npm run functional-regression:test
      - name: Stage G M37 browser characterization
        run: npm run functional-regression:browser
      - name: Stage G M37 evidence summary
        run: npm run functional-regression:evidence
      - uses: actions/upload-artifact@v7
        with:
          name: m37-functional-regression-evidence
          path: m37-evidence/
          if-no-files-found: error
