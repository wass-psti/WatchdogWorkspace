name: Stage G M41 Account Functional Recovery
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: 'npm' }
      - run: npm ci
      - run: npm run account-recovery:check
      - run: npm run account-recovery:test
      - run: npm run account-recovery:browser
