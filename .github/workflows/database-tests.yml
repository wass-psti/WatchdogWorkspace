name: Database and RLS tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Verify governed Node/npm toolchain
        run: |
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
      - name: Run isolated pgTAP Database/RLS suite
        run: npm run database-rls:test:local
