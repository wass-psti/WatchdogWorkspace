name: Stage G M39 Auth Session Access Context
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dependencies:ensure
      - run: npm run auth-stabilization:check
      - run: npm run auth-stabilization:test
      # Preserve frozen M39 browser scenarios on original predecessor; M145
      # validates current login/session restoration and retired-route denial.
      - run: node scripts/run-m145-current-core-browser.mjs auth
      - run: npm run typecheck
      - run: npm run lint:eslint
