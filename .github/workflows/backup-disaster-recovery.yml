name: Backup and Disaster Recovery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  backup-dr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run backup-dr:check
      - run: npm run backup-dr:test
      # The frozen M29 checker assumes pre-retirement CI directly invokes M29.
      # M145 keeps the distinct database-rls PR workflow mandatory and checks
      # both its trigger and its source rather than falsely passing old M29.
      - run: node scripts/verify-m145-pr-regression.mjs
      - run: npm run observability:check
      - run: npm run service-worker-update:check
      - run: npm run lint:eslint
      - run: npm run typecheck
