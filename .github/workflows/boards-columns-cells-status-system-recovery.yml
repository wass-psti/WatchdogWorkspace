name: Boards Columns Cells Status System Recovery
on:
  workflow_dispatch:
    inputs:
      historical_sha:
        description: 'Must equal exact pre-removal production Git SHA; run on the archived predecessor ref'
        required: true
        type: string
permissions:
  contents: read
jobs:
  m48:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jtlusodorfnyzgyuewkz.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_CrkvaTRYTYAMVbieywNMyg_a0F7HpB6' }}
    steps:
      - name: Fail closed unless executing the exact original milestone commit
        shell: bash
        env:
          EXPECTED_HISTORICAL_SHA: ${{ inputs.historical_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SHA" = '994e925898fa7de596050cd06ec68a5a94a7c92b' || { echo 'Historical-only workflow must run on the original archived commit' >&2; exit 1; }
          test "$EXPECTED_HISTORICAL_SHA" = '994e925898fa7de596050cd06ec68a5a94a7c92b' || { echo 'Expected SHA not authorized' >&2; exit 1; }

      - uses: actions/checkout@v4
      - name: Restore pinned M108 predecessor provenance
        uses: ./.github/actions/prepare-m108-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci --ignore-scripts
      - run: npm run modern-tests:toolchain:ensure
      - name: Verify M48 fail-closed certification harnesses
        run: |
          npm run boards-columns-cells-status:finalizer:test
          npm run boards-columns-cells-status:production-boundary
      - name: Resolve M48 milestone state
        id: milestone_state
        shell: bash
        run: |
          if grep -Eq "activationState:[[:space:]]*'active-certified'" config/stage-g-m48-boards-columns-cells-status-recovery-target.ts; then
            echo 'state=active-certified' >> "$GITHUB_OUTPUT"
          elif grep -Eq "activationState:[[:space:]]*'implementation-complete-pending-certification'" config/stage-g-m48-boards-columns-cells-status-recovery-target.ts; then
            echo 'state=pending' >> "$GITHUB_OUTPUT"
          elif grep -Eq "activationState:[[:space:]]*'implementation-in-progress'" config/stage-g-m48-boards-columns-cells-status-recovery-target.ts; then
            echo 'state=in-progress' >> "$GITHUB_OUTPUT"
          else
            echo 'FAIL: unrecognized M48 milestone state.' >&2
            exit 1
          fi
      - name: Verify M48 candidate without publication
        if: ${{ github.event_name == 'pull_request' || steps.milestone_state.outputs.state == 'in-progress' }}
        run: npm run boards-columns-cells-status:verify:candidate
      - name: Verify active-certified M48 regression without publication
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'active-certified' }}
        run: npm run boards-columns-cells-status:verify:release
      - name: Run fail-closed M48 certification and artifact transaction
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'pending' }}
        env:
          M48_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run boards-columns-cells-status:certify
      - name: Independently verify certified M48 artifact
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'pending' }}
        env:
          M48_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/verify-stage-g-m48-certified-artifact.mjs
      - name: Upload certified M48 baseline
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'pending' }}
        uses: actions/upload-artifact@v7
        with:
          name: work-management-v1.43.2-stage-g-m48-certified-${{ github.sha }}
          path: |
            m48-certified-artifacts-upload/Work-Management-App-v1.43.2-Stage-G-M48-Certified-Baseline.zip
            m48-certified-artifacts-upload/Work-Management-App-v1.43.2-Stage-G-M48-Certified-Baseline-PASS.txt
          if-no-files-found: error
          retention-days: 90
