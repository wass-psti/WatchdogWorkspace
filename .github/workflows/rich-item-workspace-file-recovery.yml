name: Rich Item Workspace File Recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  m50:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jtlusodorfnyzgyuewkz.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_CrkvaTRYTYAMVbieywNMyg_a0F7HpB6' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci --ignore-scripts
      - run: npm run modern-tests:toolchain:ensure
      - name: Resolve M50 milestone state
        id: milestone_state
        shell: bash
        run: |
          if grep -Eq "activationState:[[:space:]]*'active-certified'" config/stage-g-m50-rich-item-workspace-file-recovery-target.ts; then
            echo 'state=active-certified' >> "$GITHUB_OUTPUT"
          elif grep -Eq "activationState:[[:space:]]*'implementation-complete-pending-certification'" config/stage-g-m50-rich-item-workspace-file-recovery-target.ts; then
            echo 'state=pending' >> "$GITHUB_OUTPUT"
          else
            echo 'FAIL: unrecognized M50 milestone state.' >&2
            exit 1
          fi
      - name: Front-load M50 static and deterministic gates
        run: |
          npm run lint:eslint
          npm run rich-item-workspace-recovery:check
          node scripts/verify-stage-g-m50-m49-certified-context.mjs
          npm run rich-item-workspace-recovery:workflows
          npm run rich-item-workspace-recovery:test
      - name: Verify M50 disposable database and Storage policy authority
        run: npm run rich-item-workspace-recovery:database
      - name: Verify global Database/RLS security baseline
        run: npm run database-rls:test:local
      - name: Verify M50 browser authority
        run: npm run rich-item-workspace-recovery:browser
      - name: Verify M50 fail-closed finalizer authority
        run: npm run rich-item-workspace-recovery:finalizer:test
      - name: Verify M50 live production attestation
        if: ${{ github.event_name == 'push' }}
        run: npm run rich-item-workspace-recovery:production
      - name: Verify M50 candidate without publication
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run rich-item-workspace-recovery:verify:candidate
      - name: Verify active-certified M50 release
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'active-certified' }}
        run: npm run rich-item-workspace-recovery:verify:release
      - name: Run fail-closed M50 certification and artifact transaction
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'pending' }}
        env:
          M50_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run rich-item-workspace-recovery:certify
      - name: Independently verify certified M50 artifact
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'pending' }}
        env:
          M50_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/verify-stage-g-m50-certified-artifact.mjs
      - name: Upload certified M50 baseline
        if: ${{ github.event_name == 'push' && steps.milestone_state.outputs.state == 'pending' }}
        uses: actions/upload-artifact@v4
        with:
          name: work-management-v1.43.2-stage-g-m50-certified-${{ github.sha }}
          path: |
            m50-certified-artifacts-upload/Work-Management-App-v1.43.2-Stage-G-M50-Certified-Baseline.zip
            m50-certified-artifacts-upload/Work-Management-App-v1.43.2-Stage-G-M50-Certified-Baseline-PASS.txt
          if-no-files-found: error
          retention-days: 90
