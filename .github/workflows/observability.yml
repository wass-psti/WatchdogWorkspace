name: Observability
on:
  push:
    branches: [main]
  pull_request:
jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run observability:check
      - run: npm run observability:test
      - run: npm run lint:eslint
      - run: npm run typecheck
