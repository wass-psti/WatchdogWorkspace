name: Users RBAC Functional Recovery
on:
  push:
  pull_request:
jobs:
  m42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run modern-tests:toolchain:ensure
      - run: npm run users-rbac-recovery:dependencies:check
      - name: Capture M42 evidence digests
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIGEST="$(node scripts/lib/stage-g-m42-certification-tree.mjs "$PWD")"
          DEPENDENCY_DIGEST="$(node scripts/lib/stage-g-m42-dependency-tree.mjs "$PWD")"
          [[ "$SOURCE_DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Invalid M42 source digest: $SOURCE_DIGEST"; exit 1; }
          [[ "$DEPENDENCY_DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Invalid M42 dependency digest: $DEPENDENCY_DIGEST"; exit 1; }
          EVIDENCE_SNAPSHOT="$RUNNER_TEMP/m42-evidence-baseline.json"
          node scripts/assert-stage-g-m42-evidence-stability.mjs capture "$EVIDENCE_SNAPSHOT"
          {
            echo "M42_SOURCE_DIGEST=$SOURCE_DIGEST"
            echo "M42_DEPENDENCY_DIGEST=$DEPENDENCY_DIGEST"
            echo "M42_EVIDENCE_SNAPSHOT=$EVIDENCE_SNAPSHOT"
            echo "WM_M42_PRESERVE_GOVERNED_TEST_TOOLCHAIN=1"
            echo "WM_M42_CERTIFICATION_DEPENDENCY_DIGEST=$DEPENDENCY_DIGEST"
          } >> "$GITHUB_ENV"
      - run: npm run users-rbac-recovery:preflight
      - name: Verify M42 evidence after preflight
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted preflight"
      - run: npm run users-rbac-recovery:check
      - name: Verify M42 evidence after static verification
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted static verification"
      - run: npm run users-rbac-recovery:test
      - name: Verify M42 evidence after deterministic verification
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted deterministic verification"
      - run: npm run users-rbac-recovery:browser
      - name: Verify M42 evidence after browser verification
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted browser verification"
      - run: npm run database-rls:test:local
      - name: Verify M42 evidence after Database/RLS verification
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted Database/RLS verification"
      - run: npm run verify:historical-all
      - name: Verify M42 evidence after historical verification
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted historical verification"
      - run: npm run typecheck
      - name: Verify M42 evidence after TypeScript verification
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted TypeScript verification"
      - run: npm run security:check
      - name: Verify M42 evidence after security verification
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "hosted security verification"
      - run: npm run verify:ui
      - name: Verify final M42 evidence stability
        run: node scripts/assert-stage-g-m42-evidence-stability.mjs verify "$M42_EVIDENCE_SNAPSHOT" "final hosted integration gate"
