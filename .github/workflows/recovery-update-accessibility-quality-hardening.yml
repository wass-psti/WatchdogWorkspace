name: Recovery Update Accessibility Quality Hardening
on:
  pull_request:
  workflow_dispatch:
jobs:
  m53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: node scripts/verify-m145-pr-regression.mjs
      - run: npm run backup-dr:test && npm run service-worker-update:test && npm run observability:test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-m145-current-core-browser.mjs quality
      - run: npm run build && node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/verify-m145-successor-core.mjs --dist
