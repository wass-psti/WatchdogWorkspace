name: Recovery Update Accessibility Quality Hardening
on:
  pull_request:
  workflow_dispatch:
jobs:
  m53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run recovery-quality:check
      - run: npm run recovery-quality:test
      - run: npx playwright install --with-deps chromium
      - run: npm run recovery-quality:browser
      - run: npm run build && npm run verify:dist
