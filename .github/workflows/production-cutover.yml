name: M145 Production Cutover Certification (Explicit Manual Gate)

# Historical M36 remains available in the immutable predecessor. This current
# M145 certification is manual, SHA-pinned and non-deploying. The normal Pages
# workflow has its own mandatory reusable successor verification dependency.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed main commit to certify (40 hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  require-reviewed-main:
    runs-on: ubuntu-latest
    steps:
      - name: Assert explicit production release commit
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Only main may be certified' >&2; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid expected main SHA' >&2; exit 1; }
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA" || { echo 'Review SHA mismatch; refusing certification' >&2; exit 1; }
          echo 'Explicit current main SHA authorization: PASS'

  certify-current-core:
    name: Reuse authenticated M145 historical and current-core gate
    needs: [require-reviewed-main]
    uses: ./.github/workflows/m145-clean-platform-successor.yml
    with:
      runtime_environment: production
    permissions:
      contents: read
